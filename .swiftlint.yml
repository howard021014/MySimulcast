# SwiftLint Configuration for MySimulcast
# Relaxed rules focusing on critical issues, not pedantic style enforcement

# Paths to exclude from linting
excluded:
  - Pods
  - .build
  - DerivedData
  - .swiftpm
  - build
  - MySimulcast.xcodeproj
  - MySimulcast.xcworkspace

# Opt-in rules (in addition to default rules)
opt_in_rules:
  - explicit_init
  - force_unwrapping
  - implicitly_unwrapped_optional
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_imports
  - unused_import

# Rules to disable
disabled_rules:
  - todo # Allow TODO comments
  - trailing_whitespace # Too pedantic for empty lines
  - vertical_whitespace_closing_braces # Relaxed formatting
  - vertical_whitespace_opening_braces # Relaxed formatting

# Rule customization
line_length:
  warning: 150
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

cyclomatic_complexity:
  warning: 10
  error: 20

nesting:
  type_level: 2
  statement_level: 5

large_tuple:
  warning: 3
  error: 4

# Force unwrapping - warn but don't error
force_unwrapping:
  severity: warning

# Force cast - warn but don't error (sometimes necessary with SwiftData)
force_cast:
  severity: warning

# Implicitly unwrapped optionals - warn in most cases
implicitly_unwrapped_optional:
  severity: warning

# Identifier naming - relaxed rules
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - url
    - URL
    - db
    - i
    - j
    - x
    - y

# Custom rules
custom_rules:
  domain_layer_purity:
    name: "Domain Layer Purity"
    regex: '(import SwiftUI|import SwiftData)'
    match_kinds: keyword
    message: "Domain layer should not import SwiftUI or SwiftData"
    severity: error

  print_statement:
    name: "Print Statement"
    regex: '\bprint\('
    message: "Use Logger instead of print()"
    severity: warning

# Reporting
reporter: "xcode"
